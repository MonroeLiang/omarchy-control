# Pushing a tag such as v0.2.0 builds the Arch package, tests it, and publishes it with
# SHA256SUMS. The curl installer and the app's own updater download from that release.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build tools
        run: >-
          pacman -Syu --noconfirm --needed
          git github-cli curl desktop-file-utils ttf-dejavu
          qt6-base qt6-declarative qt6-svg qt6-wayland hicolor-icon-theme

      - uses: actions/checkout@v4

      - name: Test and build the package
        run: |
          useradd -m builder
          chown -R builder:builder .
          sudo -u builder --preserve-env=GITHUB_REF_NAME tools/release-build.sh "$GITHUB_REF_NAME"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "Omarchy Control ${GITHUB_REF_NAME#v}"
          --generate-notes
          --verify-tag
